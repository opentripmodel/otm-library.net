name: Release Pipeline (Build PRs)

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO:                     true
  NUGET_OUTPUT:                      ${{ github.workspace }}/nuget
  # NUGET_APIKEY is no longer a stored secret. It is issued per-run by NuGet/login
  # via Trusted Publishing (OIDC) and injected on the publish step below.

permissions:
  contents: write
  packages: write
  id-token: write # required for NuGet Trusted Publishing (OIDC token exchange)

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  #push: # Run on every push to any branch
  #  branches: [ '**' ]  # All branches
  #  tags-ignore: [ '**' ]  # But no tags
  pull_request:
    types: [ opened ]
    branches: [ main ]

jobs:
  build_pack_publish:
    runs-on: ubuntu-latest
    #if: startsWith(github.head_ref, 'release-') || github.event_name == 'workflow_dispatch' # Run only on release branch or manual run
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make release script executable
        run:  chmod +x .github/workflows/scripts/release.sh

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: filogic # nuget.org organization that owns the Trusted Publishing policy

      - name: Run Pack & Publish Script
        run:  node .github/workflows/scripts/release-workflow.js
        env:
          NUGET_APIKEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
